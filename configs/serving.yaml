# Used by the recorded three-case NVIDIA deployment smoke on one 32 GB GPU.
v:
  model: core12345/ChipMATE-V-4B
  base_url: http://127.0.0.1:8001/v1
p:
  model: core12345/ChipMATE-P-4B
  base_url: http://127.0.0.1:8002/v1
runtime:
  dtype: bfloat16
  max_model_len: 16384
  max_num_seqs: 3
  gpu_memory_utilization_per_service: 0.45
  # Eager text-only serving used by the recorded NVIDIA run.
  extra_args: ["--enforce-eager", "--language-model-only"]
  environment:
    CUDA_VISIBLE_DEVICES: "0"
